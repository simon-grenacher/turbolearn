<title>TurboLearn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: Cockpit-Dashboard. Oben Instrumente (PS, Serie, Tagesziel), darunter Units und Fahrmodi. Eine Spalte auf dem Handy. */
:root{
  --bg:#07090d;
  --panel:#10141c;
  --panel-2:#171c27;
  --line:#262e3d;
  --fg:#f3f5f9;
  --muted:#8e97ab;
  --orange:#ff7a00;
  --orange-2:#ffa246;
  --blue:#2f6dff;
  --blue-deep:#0c2a6e;
  --good:#22c77a;
  --bad:#ff4b5c;
  --display:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cut:14px;
  --r-lg:22px;
  --r-md:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(47,109,255,.18), transparent 60%),
    radial-gradient(900px 400px at -10% 110%, rgba(255,122,0,.10), transparent 60%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 6px),
    var(--bg);
  background-attachment:fixed;
  color:var(--fg);
  font-family:var(--body);
  font-size:17px;
  line-height:1.45;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
#app{
  max-width:1000px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px 40px;
  display:flex;flex-direction:column;gap:20px;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--orange-2);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.02em}
.label{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;font-style:italic;font-size:30px;letter-spacing:.01em;line-height:1;margin-right:auto;display:flex;align-items:center;gap:10px}
.logo{padding:0;text-align:left}
.logo .t{color:var(--orange)}
.logo .l{color:var(--blue)}
.logo svg{width:34px;height:34px}
.pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:8px 14px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);font-family:var(--display);font-weight:700;font-size:18px}
.pill svg{width:20px;height:20px;flex:none}
.pill small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.icon-btn{width:46px;height:46px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.icon-btn svg{width:22px;height:22px}

/* Panels */
.panel{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));padding:20px}
.hero{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;align-items:center}
.gauge{width:100%;max-width:260px;display:block;margin:0 auto}
.hero-right{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero-car{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero-car .car{width:220px;max-width:100%}
.next{display:flex;flex-direction:column;gap:6px}
.bar{height:12px;background:var(--bg);border:1px solid var(--line);position:relative;overflow:hidden;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--orange),var(--orange-2));transition:width .6s}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.chip b{font-family:var(--display);font-size:16px}
.chip.ok{border-color:var(--good);color:var(--good)}
.chip svg{width:18px;height:18px}

/* Section heads */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec h2{font-size:22px;text-transform:uppercase}
.tabs{display:flex;gap:8px}
.tab{padding:8px 16px;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:14px;border:1px solid var(--line);background:var(--panel);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.tab.on{background:var(--blue);border-color:var(--blue)}
.tab:disabled{opacity:.45;cursor:default}

/* Units */
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.unit{text-align:left;display:flex;flex-direction:column;gap:10px;position:relative;border:2px solid var(--line)}
.unit.on{border-color:var(--orange);background:linear-gradient(180deg,rgba(255,122,0,.12),var(--panel))}
.unit .check{position:absolute;top:14px;right:16px;width:28px;height:28px;border:2px solid var(--line);display:grid;place-items:center}
.unit.on .check{background:var(--orange);border-color:var(--orange)}
.unit .check svg{width:18px;height:18px;opacity:0}
.unit.on .check svg{opacity:1}
.unit h3{font-size:26px;font-style:italic}
.unit p{margin:0;color:var(--muted);font-size:14px}
.gears{display:flex;gap:6px;align-items:center}
.gears span{width:26px;height:10px;background:var(--line);clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.gears span.f{background:var(--orange)}
.gears em{font-style:normal;font-size:13px;color:var(--muted);margin-left:6px}

/* Modes */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;min-height:120px;justify-content:flex-end;position:relative;overflow:hidden}
.mode svg.mi{position:absolute;top:16px;right:16px;width:40px;height:40px;opacity:.9}
.mode b{font-family:var(--display);font-size:21px;text-transform:uppercase;letter-spacing:.04em}
.mode span{font-size:14px;color:var(--muted)}
.mode.main{grid-column:span 3;min-height:130px;background:linear-gradient(110deg,var(--orange) 0%,#ff5a00 55%,var(--blue-deep) 140%);border-color:transparent}
.mode.main b{font-size:32px;font-style:italic}
.mode.main span{color:rgba(255,255,255,.88);font-size:16px}
.mode:disabled{opacity:.5;cursor:default}

/* Einfacher Start */
.icon-btn.ghost{background:none;border-color:transparent;opacity:.7}
.hero2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
.carbtn{padding:0;display:block;width:100%}
.carbtn .car{width:100%;max-width:440px;display:block;margin:0 auto}
.hero-info{display:flex;flex-direction:column;gap:12px;min-width:0}
.hero-info h2{font-size:clamp(30px,4.5vw,42px);font-style:italic}
.bar.big{height:18px}
.status{font-size:15px;color:var(--muted)}
.status.ok{color:var(--good)}
.units2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.dolphin{width:100%;max-width:680px;display:block;margin:0 auto}
.dolphin .mk circle{fill:var(--panel-2);stroke:var(--muted);stroke-width:2}
.dolphin .mk text{fill:var(--fg);font:700 16px var(--display)}
.dolphin .mk.hl circle{fill:var(--orange);stroke:var(--orange)}
.dolphin .mk.hl text{fill:#140800}
.dolphin .mk.ok circle{fill:var(--good);stroke:var(--good)}
.dolphin .mk.no circle{fill:var(--bad);stroke:var(--bad)}
.dolphin .mk[data-a]{cursor:pointer}
.dolphin .mk[data-a] circle{stroke:var(--blue);stroke-width:3}
.opt.long{font-size:17px;text-align:left;line-height:1.35}
.factlist{text-align:left;margin:0;padding-left:22px;font-size:20px;display:flex;flex-direction:column;gap:8px;max-width:640px}
.sbadge{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:5px 12px 5px 8px;border-radius:999px;font:700 13px var(--display);letter-spacing:.1em;text-transform:uppercase}
.sbadge svg{width:18px;height:18px}
.ucard .label{margin-top:-2px}
.cta.small{padding:9px 14px;font-size:14px}
.gbtns{gap:8px}
.qbanner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.qbanner div{display:flex;flex-direction:column;gap:2px}
.qbanner b{font-family:var(--display);font-size:22px;font-style:italic}
.paints{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:720px}
.pchip{display:flex;flex-direction:column;gap:6px;align-items:center;padding:6px;border:2px solid var(--line);border-radius:var(--r-md);background:var(--panel-2);font-size:13px;color:var(--muted)}
.pchip img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px}
.pchip.on{border-color:var(--orange);color:var(--fg)}
.pchip.lock img{filter:grayscale(1) brightness(.35)!important}
.qscore{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:20px}
.qscore b{font-size:30px;color:var(--orange-2)}
.qboard{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qcardx{background:var(--panel);border:2px solid var(--line);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.qcardx.back{display:grid;place-items:center;min-height:320px;background:linear-gradient(135deg,var(--blue-deep),var(--panel))}
.qback{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);font-family:var(--display);text-transform:uppercase;letter-spacing:.12em}
.qback svg{width:72px;height:72px}
.qname{display:flex;flex-direction:column;gap:2px}
.qname b{font-family:var(--display);font-size:22px;font-style:italic}
.qlock{font-size:12px;color:var(--muted)}
.qstats{display:flex;flex-direction:column;gap:6px}
.qstat{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--panel-2);text-align:left;font-size:15px}
.qstat small{color:var(--muted);font-size:11px}
.qstat b{font-family:var(--display);font-size:18px;white-space:nowrap}
.qstat[data-a]{border-color:var(--blue)}
.qstat.win{border-color:var(--good);background:rgba(34,199,122,.16)}
.qstat.lose{border-color:var(--bad);background:rgba(255,75,92,.16)}
.qstat.tie{border-color:var(--orange)}
.qmsg{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.qmsg p{margin:0;font-size:18px}
@media (max-width:620px){ .qboard{grid-template-columns:1fr} .paints{grid-template-columns:repeat(2,minmax(0,1fr))} }
.mvis{width:100%;display:flex;justify-content:center}
.hze{height:110px;max-width:100%}
.mauer{display:flex;flex-direction:column;align-items:center;gap:4px}
.mauer div{display:flex;gap:4px}
.mz{min-width:78px;padding:10px 8px;border:2px solid var(--line);border-radius:8px;font:700 24px var(--display);text-align:center;background:var(--panel-2)}
.mz.hole,.tafel .hole{border-color:var(--orange);color:var(--orange)}
.rlist{font:600 24px var(--display);display:flex;flex-direction:column;gap:6px}
.rlist .hl{color:var(--orange-2)}
.pairs{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.pp{display:flex;gap:4px}
.pp b{background:var(--panel-2);border:2px solid var(--line);border-radius:8px;padding:8px 12px;font:700 24px var(--display)}
.tafel{display:grid;grid-template-columns:repeat(3,76px);gap:4px}
.tafel span{border:2px solid var(--line);border-radius:6px;padding:10px 0;text-align:center;font:700 22px var(--display);background:var(--panel-2)}
.numline{width:100%;max-width:640px}
.geo{width:200px;max-width:60%;height:auto}
.opt.pic .geo{width:110px;max-width:100%}
.mark{color:var(--orange);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:8px}
.stones{display:inline-flex;gap:10px}
.stones i{width:34px;height:34px;border-radius:50%;display:block;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.lt{font:700 26px var(--display);color:var(--muted);align-self:center}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pcell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:130px;padding:18px 10px 14px;background:var(--panel);border:2px solid var(--line);border-radius:var(--r-md);text-align:center}
.pcell b{font-size:clamp(18px,2.6vw,24px);overflow-wrap:anywhere}
.pcell .pn{position:absolute;top:8px;left:12px;font:700 14px var(--display);color:var(--muted)}
.pcell .pimg{font-size:34px;line-height:1}
.pcell .pans{font-size:clamp(17px,2.4vw,22px);color:var(--orange-2);font-weight:600;overflow-wrap:anywhere}
.pcell[data-a]{border-color:var(--blue);cursor:pointer}
.pcell.ok{border-color:var(--good);background:rgba(34,199,122,.14)}
.pcell .pchk{position:absolute;top:6px;right:12px;color:var(--good);font-size:22px;font-weight:700}
.pcell:disabled{opacity:1;cursor:default}
@media (max-width:520px){ .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.subj{display:flex;flex-direction:column;gap:10px}
.subj-h{font-size:15px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.chips-sent{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.wchip{padding:12px 16px;font-size:24px;font-weight:600;background:var(--panel-2);border:2px solid var(--line);border-radius:12px}
.wchip.sel{background:rgba(47,109,255,.25);border-color:var(--blue)}
.wchip.ok{background:rgba(34,199,122,.18);border-color:var(--good)}
.wchip.no{background:rgba(255,75,92,.18);border-color:var(--bad)}
.blank{display:inline-block;min-width:2.2em;border-bottom:4px solid var(--orange);color:transparent}
.persgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center;margin-bottom:-8px}
.opt.pers{font-size:19px}
.ucard{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px 20px;background:var(--panel);border:2px solid var(--line);clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.ucard.on{border-color:var(--orange);background:linear-gradient(180deg,rgba(255,122,0,.14),var(--panel))}
.ucard b{font-family:var(--display);font-size:clamp(22px,3.4vw,30px);font-style:italic;padding-right:36px}
.ucard .check{position:absolute;top:16px;right:16px;width:30px;height:30px;border:2px solid var(--line);display:grid;place-items:center}
.ucard.on .check{background:var(--orange);border-color:var(--orange)}
.ucard .check svg{width:18px;height:18px;opacity:0}
.ucard.on .check svg{opacity:1}
.ucard .bar{height:8px}
.go{display:flex;flex-direction:column;align-items:center;gap:2px;padding:26px 20px;background:linear-gradient(110deg,var(--orange),#ff5a00);color:#140800;clip-path:polygon(22px 0,100% 0,calc(100% - 22px) 100%,0 100%)}
.go b{font-family:var(--display);font-weight:700;font-style:italic;font-size:clamp(48px,9vw,72px);line-height:1;text-transform:uppercase;letter-spacing:.02em}
.go span{font-weight:600;font-size:18px}
.go:disabled{opacity:.45;cursor:default}
.more-toggle{align-self:center;padding:10px 18px;color:var(--muted);font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:14px;border-bottom:2px solid var(--line)}
.modes .mode{min-height:96px}
.modes .mode svg.mi{width:34px;height:34px}

/* Play screen */
.play-top{display:flex;align-items:center;gap:14px}
.segs{flex:1;display:flex;gap:4px}
.segs span{flex:1;height:14px;background:var(--panel-2);border:1px solid var(--line);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.segs span.ok{background:var(--good);border-color:var(--good)}
.segs span.no{background:var(--bad);border-color:var(--bad)}
.segs span.cur{background:var(--orange);border-color:var(--orange)}
.qcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:28px 20px;min-height:220px;justify-content:center}
.qhint{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:14px;color:var(--orange-2);font-weight:600}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(30px,5.5vw,52px);line-height:1.1;overflow-wrap:anywhere}
.qtext.de{color:var(--fg)}
.qimg{font-size:72px;line-height:1}
.speak{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;background:var(--blue);font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.speak svg{width:24px;height:24px}
.speak.big{padding:22px 34px;font-size:20px}
.speak.big svg{width:36px;height:36px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{padding:20px 16px;font-size:22px;font-weight:600;background:var(--panel-2);border:2px solid var(--line);min-height:76px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);overflow-wrap:anywhere}
.opt.pic{font-size:56px;padding:10px}
.opt.ok{background:rgba(34,199,122,.18);border-color:var(--good)}
.opt.no{background:rgba(255,75,92,.18);border-color:var(--bad)}
.opt:disabled{cursor:default}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:62px;align-items:center}
.slot{width:48px;height:58px;border-bottom:3px solid var(--muted);display:grid;place-items:center;font-size:30px;font-weight:600;font-family:var(--body)}
.slot.f{border-color:var(--orange)}
.slot.gap{width:18px;border:0}
.slot.fixed{border:0;color:var(--muted)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{min-width:56px;height:60px;padding:0 14px;font-size:28px;font-weight:600;background:var(--panel-2);border:2px solid var(--line);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.tile.word{font-size:22px}
.tile.used{visibility:hidden}
.sentence{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:68px;padding:10px;border-bottom:3px solid var(--muted);width:100%}
.sentence .tile{border-color:var(--orange)}
.type-in{width:100%;max-width:520px;font:600 32px var(--body);text-align:center;padding:16px;background:var(--bg);color:var(--fg);border:2px solid var(--line);user-select:text;-webkit-user-select:text}
.type-in:focus{border-color:var(--orange);outline:none}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cta{padding:16px 32px;font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.06em;background:var(--orange);color:#140800;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.cta.sec2{background:var(--panel-2);color:var(--fg);border:1px solid var(--line)}
.cta.blue{background:var(--blue);color:#fff}
.cta:disabled{opacity:.4;cursor:default}
.fb{position:sticky;bottom:0;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;padding:16px 20px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--good);background:#0c1a14}
.fb.no{border-color:var(--bad);background:#1c0d10}
.fb h3{font-size:24px}
.fb p{margin:2px 0 0;font-size:18px}
.fb .ps{font-family:var(--display);font-weight:700;color:var(--orange-2);font-size:24px}
.turbo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) skewX(-10deg);font-family:var(--display);font-weight:700;font-style:italic;font-size:clamp(36px,8vw,72px);color:var(--orange);text-shadow:0 0 30px rgba(255,122,0,.6);pointer-events:none;animation:pop 1.1s ease-out forwards;z-index:20;white-space:nowrap}

function numWord(n){
  if(n === 100) return 'one hundred';
  if(n < 20) return ONES[n];
  const t = Math.floor(n/10), o = n%10;
  return TENS[t] + (o ? '-' + ONES[o] : '');
}
function pickNumber(){
  if(Math.random() < .25) return [14,40,19,90,67][Math.floor(Math.random()*5)]; // Zahlen vom Unit-2-Blatt

  if(r < .5) return 100;

}

const LS_KEY = 'turbolearn-v1';
const blank = () => ({v:1, ps:0, items:{}, days:{}, rounds:0, seconds:0, pin:null, sound:true, numbers:{r:0,w:0}, units:['u2','u3'], skills:{}, updatedAt:0});
let S = blank();

let db = null, docRef = null, writing = false, pendingWrite = false, saveTimer = null;

function save(){
  S.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, 900);
}
async function pushRemote(){
  if(!docRef) return;
  if(writing){ pendingWrite = true; return; }
  writing = true;
  try { await docRef.set(JSON.parse(JSON.stringify(S))); }
  catch(e){ if(e && e.code === 'unavailable'){ setTimeout(pushRemote, 1500 + Math.random()*1000); } }
  writing = false;
  if(pendingWrite){ pendingWrite = false; pushRemote(); }
}
async function connect(){
  if(!window.claude || !window.claude.use) return;
  try {
    const [dbNs, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!dbNs || !user) return;
    const id = await user.id();
    if(!id) return;
    db = dbNs;
    docRef = db.doc('data/users/' + id + '/turbolearn');
    const snap = await docRef.get();
    if(snap.exists){
      const remote = snap.data();
      if((remote.updatedAt||0) > (S.updatedAt||0)){
        S = Object.assign(blank(), JSON.parse(JSON.stringify(remote)));
        try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {}
        if(view.name === 'home' || view.name === 'garage') render();
      } else if((S.updatedAt||0) > (remote.updatedAt||0)) pushRemote();
    } else if(S.updatedAt) pushRemote();
    syncState = 'online';
    if(view.name === 'parents') render();
  } catch(e){ syncState = 'offline'; }
}

  if(!window.claude || !window.claude.use) return;

const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const dayKey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function weekKey(d){ const t = new Date(d); t.setHours(0,0,0,0); t.setDate(t.getDate() - ((t.getDay()+6)%7)); return dayKey(t); }
function streak(){
  const d = new Date(); let count = 0; const used = {};
  if(!S.days[dayKey(d)]) d.setDate(d.getDate()-1);
  for(let i=0;i<400;i++){
    const k = dayKey(d);
    if(S.days[k]) count++;
    else {
      const w = weekKey(d);
      if(used[w] || count === 0) break;
      used[w] = true;
    }
    d.setDate(d.getDate()-1);
  }
  return count;
}

}

  const base = norm(en); const f = [base];

  return f;
}
function weightedPick(pool, n){
  const out = []; let p = pool.slice();
  while(out.length < n && p.length){
    const ws = p.map(i => { const s = st(i.id); return Math.pow(6 - s.b, 2) + (s.w > s.r ? 4 : 0) + (s.b === 0 ? 3 : 0); });
    let r = Math.random() * ws.reduce((a,b)=>a+b,0), k = 0;
    while(r > ws[k]) { r -= ws[k]; k++; }
    out.push(p[k]); p.splice(k,1);
  }
  return out;
}

let actx = null;
function audio(){ if(!actx){ try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if(actx && actx.state === 'suspended') actx.resume(); return actx; }
function engine(){
  if(!S.sound) return; const a = audio(); if(!a) return;
  const t = a.currentTime, o = a.createOscillator(), o2 = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
  o.type = 'sawtooth'; o2.type = 'square';
  o.frequency.setValueAtTime(70,t); o.frequency.exponentialRampToValueAtTime(260,t+.35); o.frequency.exponentialRampToValueAtTime(140,t+.7);
  o2.frequency.setValueAtTime(35,t); o2.frequency.exponentialRampToValueAtTime(130,t+.35); o2.frequency.exponentialRampToValueAtTime(70,t+.7);
  f.type = 'lowpass'; f.frequency.setValueAtTime(600,t); f.frequency.linearRampToValueAtTime(1800,t+.35); f.frequency.linearRampToValueAtTime(500,t+.7);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.22,t+.05); g.gain.exponentialRampToValueAtTime(.0001,t+.75);
  o.connect(f); o2.connect(f); f.connect(g); g.connect(a.destination);
  o.start(t); o2.start(t); o.stop(t+.8); o2.stop(t+.8);
}
function beep(freqs, dur, type){
  if(!S.sound) return; const a = audio(); if(!a) return;
  freqs.forEach((fq,i) => {
    const t = a.currentTime + i*dur, o = a.createOscillator(), g = a.createGain();
    o.type = type||'square'; o.frequency.value = fq;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.12,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur*.95);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur);
  });
}

let R = null;
function distractors(item, n, field){
  const pool = poolItems().filter(i => i.id !== item.id && i[field] && i[field] !== item[field]);
  const same = shuffle(pool.filter(i => i.kind === item.kind && (field !== 'img' || i.img)));
  const rest = shuffle(pool.filter(i => !same.includes(i)));
  const out = [], seen = new Set([item[field]]);
  for(const i of [...same, ...rest]){ if(out.length >= n) break; if(!seen.has(i[field])){ seen.add(i[field]); out.push(i); } }
  return out;
}
function buildQ(item, forceType){

  if(isMath(item)) return buildMathQ(item, forceType);
  const b = st(item.id).b; let types;
  if(b <= 1) types = item.img ? ['pic','pic','mc_en_de','listen'] : ['mc_en_de','listen'];
  else if(b === 2) types = isSentence(item) ? ['sentence','mc_de_en','listen'] : ['spell','mc_de_en','listen'];
  else types = isSentence(item) ? ['sentence','sentence','spell'] : ['spell','spell','mc_de_en'];
  if(item.group === 'months' && b >= 1) types = types.concat(['mon_next','mon_order']);
  const type = forceType || types[Math.floor(Math.random()*types.length)];
  const q = {item, type, retry:false};
  if(type === 'mon_next'){
    const k = MONTHS.indexOf(item.en), nx = MONTHS[(k+1)%12];
    q.opts = optsFrom(nx, MONTHS.filter(m => m !== nx && m !== item.en), 4);
    q.sol = 'After ' + item.en + ' comes ' + nx + '.'; q.say = item.en + ', ' + nx;
  }
  if(type === 'mon_order'){
    const k = MONTHS.indexOf(item.en), start = Math.max(0, Math.min(8, k - Math.floor(Math.random()*4)));
    const seq = MONTHS.slice(start, start+4);
    q.target = seq.join(' '); q.tiles = shuffle(seq).map(w => ({ch:w, used:false})); q.filled = [];
    q.sol = seq.join(', '); q.say = seq.join(', ');
  }
  if(type === 'pic'){ q.opts = shuffle([item, ...distractors(item, 3, 'img')]).map(i => ({t:i.img, ok:i.id===item.id})); }
  else if(type === 'mc_en_de' || type === 'listen'){ q.opts = shuffle([item, ...distractors(item, 3, 'de')]).map(i => ({t:i.de, ok:i.id===item.id})); }
  else if(type === 'mc_de_en'){ q.opts = shuffle([item, ...distractors(item, 3, 'en')]).map(i => ({t:i.en, ok:i.id===item.id})); }
  else if(type === 'spell'){

      q.filled = [];

  else if(type === 'sentence'){
    q.target = norm(item.en);

  }

}

function buildNumQ(forceType){

  const type = forceType || types[Math.floor(Math.random()*types.length)];

    if(R.combo >= 3 && !q.retry){ ps += 5; }
    R.earned += ps; S.ps += ps;
    engine();
    if(R.combo === 3 || R.combo === 6 || R.combo === 9) turboFlash(R.combo === 3 ? 'TURBO!' : R.combo + 'er-Serie!');
  } else {
    R.combo = 0;
    wrongSound();
  }
  if(!ok && !q.retry){
    const again = buildQ(it.kind === 'num' ? {kind:'num'} : it, q.type);
    if(it.kind === 'num'){ again.item = it; if(again.opts){ again.opts = shuffle(q.opts.map(o => ({...o}))); } }
    again.retry = true;
    R.queue.push(again);
  }
  R.results.push(ok);
  if(!q.retry){ R.firstAll++; if(ok) R.firstOk++; }
  if(q.skill && !q.retry){ const sk = (S.skills[q.skill] = S.skills[q.skill] || {r:0,w:0}); ok ? sk.r++ : sk.w++; }
  const solText = (q.de || q.sol) ? q.sol : it.kind === 'num' ? (q.type === 'num_write' ? it.en : it.n + ' = ' + it.en) : (q.type === 'mc_en_de' || q.type === 'listen' || q.type === 'pic' ? it.en + ' = ' + it.de : it.en);
  const praise = ['Stark!','Vollgas!','Perfekt!','Super!','Genau!'];
  R.fb = {ok, ps, pick: extra && extra.pick, sol: q.de ? (ok ? '' : q.sol) : ok ? (q.type === 'pic' || q.type === 'listen' ? it.en + ' = ' + it.de : '') : solText, say: q.say || (it.kind === 'num' ? String(it.n) : it.en), title: praise[Math.floor(Math.random()*praise.length)]};
  save();
  render();
  if(q.de) return;
  const sayTxt = q.say || (it.kind === 'num' ? String(it.n) : it.en);
  if(ok && ['spell','sentence','num_write','mc_de_en','mon_next','mon_order','num_age'].includes(q.type)) setTimeout(() => say(sayTxt), 350);
  if(!ok) setTimeout(() => say(sayTxt), 350);
}
function nextQ(){
  R.fb = null; R.typed = '';
  R.idx++;
  if(R.idx >= R.queue.length) return finishRound(R.kind || 'race');
  render(); speakCurrent();
  const inp = document.getElementById('typein'); if(inp) setTimeout(() => inp.focus(), 50);
}
function finishRound(kind, extraPs){
  const secs = Math.round((Date.now() - (R ? R.start : Date.now()))/1000);
  const before = carsUnlocked();
  const firstToday = !doneToday();
  let bonus = 20 + (extraPs||0);
  if(firstToday) bonus += 30;
  S.ps += bonus; S.rounds++; S.seconds += Math.min(secs, 1800); S.days[today()] = true;
  save();
  const after = carsUnlocked();
  const total = (R ? R.earned : 0) + bonus;
  const right = R && R.results ? R.firstOk : 0;
  const all = R && R.results ? R.firstAll : 0;
  go({name:'end', kind, total, bonus, firstToday, newCar: after > before ? CARS[after-1] : null, right, all});
  if(after > before) fanfare(); else engine();
}

    return [{id:i.id, side:'en', t:i.en}, {id:i.id, side:'de', t:i.de}]; }));

  return `<div class="play-top"><button class="icon-btn" data-a="quit" aria-label="Beenden">${IC.x}</button><h2 style="flex:1;text-transform:uppercase">Memory</h2><div class="pill num">Züge ${M.moves}</div><div class="pill num">${IC.ps}${R.earned}</div></div>

    return `<button class="mcard ${c.side} ${open?'open':''} ${M.done.has(c.id)?'done':''}" data-a="mem" data-i="${i}" ${M.done.has(c.id)?'disabled':''}>${open ? esc(c.t) : IC.logo.replace('<svg','<svg class="back"')}</button>`; }).join('')}</section>`;
}
function memTap(i){
  if(M.lock || M.open.includes(i)) return;
  const c = M.cards[i];
  if(c.side === 'en' && !c.nosay) say(c.t);
  M.open.push(i);
  if(M.open.length === 2){
    M.moves++;
    const [a,b] = M.open.map(k => M.cards[k]);
    if(a.id === b.id){
      M.done.add(a.id); M.open = []; R.earned += 5; S.ps += 5;

    } else {

}

let P = null, speakSess = null;
function startSpeak(){
  const deck = weightedPick(poolItems().filter(i => isEn(i) && words(i.en).length <= 4), 8);

  P = {deck, i:0, heard:'', live:false, result:null};
  R = {start:Date.now(), earned:0, results:null};
  speakSess = {
    partial: t => { if(!P) return; P.heard = t; render(); },
    final: t => { if(!P) return; P.heard = t; evalSpeech(t); },

}
function evalSpeech(t){
  const it = P.deck[P.i];
  const clean = s => norm(s).toLowerCase().replace(/[^a-z0-9' ]/g,'').replace(/^an? /,'').replace(/^i am /,"i'm ");
  const ok = clean(t) === clean(it.en) || clean(t).includes(clean(it.en));
  P.result = ok;
  if(ok){ R.earned += 10; S.ps += 10; const s = st(it.id); s.r++; if(s.b < 3) s.b++; engine(); save(); try { dictation.stop(); } catch(e){} }
  render();
}

      <button class="cta sec2" data-a="backup-code">Sicherungscode anzeigen</button>
    </div>
    ${backupMsg ? `<p class="note ok-msg">${esc(backupMsg)}</p>` : ''}
    ${backupCode ? `<textarea id="backupcode" class="codebox">${esc(backupCode)}</textarea><div class="row">${navigator.share ? '<button class="cta blue" data-a="share-code">Teilen (Notizen, E-Mail …)</button>' : ''}<button class="cta sec2" data-a="copy-code">Code kopieren</button></div><p class="note">Speichern Sie den ganzen Code, z.B. in der Notizen-App. Er beginnt mit «TL1:».</p>` : ''}
    <div class="label" style="margin-top:8px">Spielstand wiederherstellen</div>
    <div class="row">
      <label class="cta sec2 filebtn">Datei wählen<input id="restorefile" type="file" accept=".json,.txt,application/json,text/plain"></label>
    </div>
    <textarea id="restorecode" class="codebox" placeholder="Oder Sicherungscode hier einfügen (lange auf das Feld tippen → Einsetzen)"></textarea>
    <div class="row">${navigator.clipboard && navigator.clipboard.readText ? '<button class="cta sec2" data-a="paste-code">Aus Zwischenablage einfügen</button>' : ''}<button class="cta" data-a="restore-code">Code prüfen</button></div>
    ${restoreMsg ? `<p class="note err-msg">${esc(restoreMsg)}</p>` : ''}
    ${restoreCand ? `<div class="row"><span>Sicherung vom ${esc(new Date(restoreCand.savedAt).toLocaleString('de-CH'))} mit <b>${(restoreCand.data.ps||0).toLocaleString('de-CH')} PS</b> laden? Der aktuelle Stand wird ersetzt.</span><button class="cta" data-a="restore-yes">Ja, laden</button><button class="cta sec2" data-a="restore-no">Abbrechen</button></div>` : ''}
  </section>
  <section class="panel"><div class="label">Einstellungen</div>
    <button class="toggle" data-a="sound"><span class="sw ${S.sound?'on':''}"></span><span>Motorensound und Effekte</span></button>
    <div class="row" style="margin-top:10px"><button class="cta sec2" data-a="change-pin">PIN ändern</button>
    ${confirmReset ? `<span>Wirklich alles löschen (PS, Autos, Lernstand)?</span><button class="cta" style="background:var(--bad);color:#fff" data-a="reset-yes">Ja, zurücksetzen</button><button class="cta sec2" data-a="reset-no">Abbrechen</button>` : `<button class="cta sec2" data-a="reset">Fortschritt zurücksetzen</button>`}</div>
  </section>`;
}

/* ---------------- Sicherung ---------------- */
function backupPayload(){
  const d = JSON.parse(JSON.stringify(S));
  Object.keys(d.items || {}).forEach(k => { const x = d.items[k]; if(!x.b && !x.r && !x.w) delete d.items[k]; });
  return {app:'TurboLearn', v:1, savedAt:Date.now(), data:d};
}
function copyText(text){
  return new Promise((ok, fail) => {
    const legacy = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0'; ta.style.fontSize = '16px';
        document.body.appendChild(ta);
        ta.contentEditable = 'true'; ta.readOnly = false;
        const range = document.createRange(); range.selectNodeContents(ta);
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
        ta.setSelectionRange(0, text.length);
        const done = document.execCommand('copy');
        document.body.removeChild(ta);
        done ? ok() : fail();
      } catch(e){ fail(); }
    };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, legacy);
    else legacy();
  });
}
function encodeBackup(){ return 'TL1:' + btoa(unescape(encodeURIComponent(JSON.stringify(backupPayload())))); }
function parseBackup(text){
  text = String(text||'').trim();
  try {
    let obj;
    const m = text.replace(/\s+/g,'').match(/TL1:([A-Za-z0-9+\/=]+)/);
    if(m) obj = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    else obj = JSON.parse(text);
    if(!obj || obj.app !== 'TurboLearn' || !obj.data || typeof obj.data !== 'object') return null;
    return obj;
  } catch(e){ return null; }
}
function offerRestore(text){
  const obj = parseBackup(text);
  restoreCand = obj; restoreMsg = obj ? '' : 'Das ist keine gültige TurboLearn-Sicherung. Prüfen Sie, ob der Code vollständig ist.';
  render();
}

/* ---------------- Render und Aktionen ---------------- */
function render(){
  const v = view.name;
  const html = v === 'home' ? renderHome() : v === 'garage' ? renderGarage() : v === 'paint' ? renderPaint() : v === 'quartett' ? renderQuartett() : v === 'qend' ? renderQEnd() : v === 'race' ? renderRace() : v === 'end' ? renderEnd()
    : v === 'memory' ? renderMemory() : v === 'cards' ? renderCards() : v === 'cmd' ? renderCmd() : v === 'speak' ? renderSpeak() : v === 'writechoose' ? renderWriteChoose() : v === 'paperchoose' ? renderPaperChoose() : v === 'paper' ? renderPaper()
    : v === 'pin' ? renderPin() : v === 'parents' ? (parentsOpen ? renderParents() : renderPin()) : renderHome();
  document.getElementById('app').innerHTML = html;
  const rf = document.getElementById('restorefile');
  if(rf) rf.addEventListener('change', () => { const f = rf.files && rf.files[0]; if(!f) return; const fr = new FileReader(); fr.onload = () => offerRestore(fr.result); fr.readAsText(f); });
  const inp = document.getElementById('typein');
  if(inp){
    inp.addEventListener('input', () => { R.typed = inp.value; });
    inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); if(R.fb) nextQ(); else checkTyped(); } });
  }
}
function checkTyped(){
  const q = R.queue[R.idx];
  const val = (document.getElementById('typein') || {}).value || '';
  if(!val.trim()) return;
  R.typed = val;
  if(q.math) return answer(val.replace(/[\s'’]/g,'') === String(q.answer));
  if(q.de) return answer(norm(val) === norm(q.answer));
  if(q.type === 'num_write'){
    const v = norm(val).replace(/\s+/g,'-'), t = q.item.en.replace(/\s+/g,'-');
    return answer(v === t || norm(val) === q.item.en);
  }
  answer(acceptForms(q.item.en).includes(norm(val)));
}
const A = {
  home: () => { WRITE_MODE = null; parentsOpen = false; confirmReset = false; pinBuf = ''; pinFirst = null; pinMsg = ''; speakSess = null; if(dictation) try { dictation.stop(); } catch(e){} go({name:'home'}); },
  garage: () => go({name:'garage'}),
  fav: el => { S.fav = +el.dataset.i; save(); engine(); render(); },
  paint: el => go({name:'paint', car:+el.dataset.i}),
  'paint-set': el => { S.paint = S.paint || {}; const k = +el.dataset.k; if(k) S.paint[view.car] = k; else delete S.paint[view.car]; save(); render(); },
  'q-start': () => { audio(); startQuartett(); },
  'q-pick': el => qResolve(el.dataset.k),
  'q-cpu': () => qResolve(Q.cpuChoice),
  'q-next': () => qNext(),
  more: () => { showMore = !showMore; render(); },
  sound: () => { S.sound = !S.sound; save(); if(S.sound){ audio(); engine(); } render(); },
  parents: () => { pinBuf = ''; pinFirst = null; pinMsg = ''; go({name: parentsOpen ? 'parents' : 'pin'}); },
  pin: el => pinPress(el.dataset.n),
  'pin-del': () => { pinBuf = pinBuf.slice(0,-1); render(); },
  'change-pin': () => { parentsOpen = false; pinBuf = ''; pinFirst = null; go({name:'pin', changePin:true}); },
  reset: () => { confirmReset = true; render(); },
  'backup-file': () => {
    if(!downloadsNs) return;
    const d = new Date(), name = 'TurboLearn-Sicherung-' + dayKey(d) + '.json';
    downloadsNs.save({filename:name, data:JSON.stringify(backupPayload(), null, 1)})
      .then(() => { backupMsg = 'Sicherung gespeichert: ' + name; render(); })
      .catch(() => { backupMsg = ''; backupCode = encodeBackup(); render(); });
  },
  'backup-code': () => { backupCode = encodeBackup(); backupMsg = ''; render(); },
  'copy-code': () => {
    copyText(backupCode).then(() => { backupMsg = 'Code kopiert. Fügen Sie ihn jetzt z.B. in einer Notiz ein.'; render(); },
      () => { backupMsg = 'Kopieren ging nicht automatisch. Tippen Sie lange auf den Code → «Alles auswählen» → «Kopieren».'; render(); });
  },
  'share-code': () => {
    navigator.share({title:'TurboLearn-Sicherung', text:backupCode}).then(() => { backupMsg = 'Sicherung geteilt.'; render(); }).catch(() => {});
  },
  'paste-code': () => {
    navigator.clipboard.readText().then(t => { const ta = document.getElementById('restorecode'); if(ta) ta.value = t; offerRestore(t); },
      () => { restoreMsg = 'Einfügen ging nicht automatisch. Tippen Sie lange in das Feld → «Einsetzen».'; render(); });
  },
  'restore-code': () => offerRestore((document.getElementById('restorecode')||{}).value),
  'restore-no': () => { restoreCand = null; render(); },
  'restore-yes': () => { const keepPin = S.pin; S = Object.assign(blank(), restoreCand.data); if(!S.pin) S.pin = keepPin; restoreCand = null; restoreMsg = ''; backupMsg = 'Spielstand geladen.'; save(); render(); },
  'reset-no': () => { confirmReset = false; render(); },
  'reset-yes': () => { const pin = S.pin, snd = S.sound; S = blank(); S.pin = pin; S.sound = snd; confirmReset = false; save(); render(); },
  unit: el => { const d = DECKS.find(x => x.id === el.dataset.u); if(!d) return; S.units = deckOn(d) ? S.units.filter(x => !d.units.includes(x)) : [...new Set([...S.units, ...d.units])].sort(); save(); render(); },
  say: el => say(el.dataset.t),
  'start-race': () => { audio(); startRace(); },
  'start-memory': () => { audio(); startMemory(); },
  'start-cards': () => { audio(); startCards(); },
  'write-choose': () => go({name:'writechoose'}),
  'paper-choose': () => go({name:'paperchoose'}),
  'paper-go': el => { audio(); startPaper(el.dataset.d); },
  'paper-show': () => { PT.shown = true; render(); },
  'paper-mark': el => { const i = +el.dataset.i; PT.ok.has(i) ? PT.ok.delete(i) : PT.ok.add(i); render(); },
  'paper-done': () => paperDone(),
  'write-go': el => { audio(); startWrite(el.dataset.m); },
  'start-cmd': () => { audio(); startCmd(); },
  'start-speak': () => { audio(); startSpeak(); },
  again: el => ({race:startRace, memory:startMemory, cards:startCards, cmd:startCmd, speak:startSpeak, paper:() => startPaper(PT ? PT.dir : 'de'), write:() => startWrite(WRITE_MODE || 'tiles')}[el.dataset.k] || startRace)(),
  quit: () => A.home(),
  pick: el => { const q = R.queue[R.idx]; const i = +el.dataset.i; answer(q.opts[i].ok, {pick:i}); },
  next: () => nextQ(),
  tile: el => {
    const q = R.queue[R.idx], i = +el.dataset.i;
    if(q.tiles[i].used) return;
    const slotsNeeded = (q.type === 'sentence' || q.type === 'mon_order' || q.type === 'm_order') ? q.tiles.length : [...q.target].filter(c => c !== ' ').length;
    if(q.filled.length >= slotsNeeded) return;
    q.tiles[i].used = true; q.filled.push(i); render();
  },
  unfill: el => { const q = R.queue[R.idx], k = +el.dataset.k; const ti = q.filled[k]; q.tiles[ti].used = false; q.filled.splice(k,1); render(); },
  'check-spell': () => {
    const q = R.queue[R.idx];
    if(q.type === 'num_write' || q.keyboard) return checkTyped();
    const need = (q.type === 'sentence' || q.type === 'mon_order' || q.type === 'm_order') ? q.tiles.length : [...q.target].filter(c => c !== ' ').length;
    if(q.filled.length < need) return;
    let built;
    if(q.type === 'sentence' || q.type === 'mon_order' || q.type === 'm_order') built = q.filled.map(f => q.tiles[f].ch).join(' ');
    else { let k = 0; built = [...q.target].map(ch => ch === ' ' ? ' ' : q.tiles[q.filled[k++]].ch).join(''); }
    answer(norm(built) === q.target);
  },
  tok: el => { const q = R.queue[R.idx]; const t = q.tokens[+el.dataset.k]; t.sel = !t.sel; render(); },
  'check-find': () => { const q = R.queue[R.idx]; if(!q.tokens.some(t => t.sel)) return; answer(q.tokens.every(t => t.sel === t.verb)); },
  part: el => { const q = R.queue[R.idx]; if(R.fb) return; const k = +el.dataset.k; answer(k === q.item.idx, {pick:k}); },
  mem: el => memTap(+el.dataset.i),
  flip: () => { C.flipped = !C.flipped; render(); },
  'card-yes': () => cardAnswer(true),
  'card-no': () => cardAnswer(false),
  'cmd-show': () => { K.shown = true; render(); },
  'cmd-next': () => { K.i++; K.shown = false; if(K.i >= K.seq.length) return finishRound('cmd'); render(); say(K.seq[K.i].en, .8); },
  mic: () => {
    if(!dictation) return;
    if(P.live){ dictation.stop().catch(() => {}); return; }
    P.heard = ''; P.result = null;
    dictation.start().catch(err => { P.live = false; P.heard = ''; render(); });
    P.live = true; render();
  },
  'speak-next': () => { try { dictation && dictation.stop().catch(() => {}); } catch(e){} P.i++; P.heard = ''; P.result = null; P.live = false; if(P.i >= P.deck.length){ speakSess = null; return finishRound('speak'); } render(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el || el.disabled) return;
  const fn = A[el.dataset.a]; if(fn) fn(el);
});

render();
connect();
connectDictation();
connectDownloads();
})();
</script>
